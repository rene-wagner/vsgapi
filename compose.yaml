services:
  database:
    image: mysql:9
    container_name: vsgapi-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: database
      MYSQL_USER: user
      MYSQL_PASSWORD: secret
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - database_data:/var/lib/mysql

  mailhog:
    image: mailhog/mailhog
    container_name: vsgapi-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  database_data:
