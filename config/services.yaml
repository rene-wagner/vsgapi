# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.mailer_from: '%env(MAILER_FROM)%'
    membership_application.template_path: '%kernel.project_dir%/resources/pdf/membership-applications/Aufnahmeantrag2018.pdf'
    membership_application.supervision_template_path: '%kernel.project_dir%/resources/pdf/membership-applications/Aufsichtspflicht.pdf'
    membership_application.storage_dir: '%kernel.project_dir%/public/antraege'
    media.storage_dir: '%kernel.project_dir%/public/uploads'
    media.max_upload_bytes: 10485760
    media.thumbnail_max_edge: 600
    page_content.iframe_url: '%env(PAGE_CONTENT_IFRAME_URL)%'
    embed.token_secret: '%env(EMBED_TOKEN_SECRET)%'
    embed.token_ttl: '%env(int:EMBED_TOKEN_TTL)%'
    embed.token_audience: '%env(EMBED_TOKEN_AUDIENCE)%'
    app.post_rewrite_model: '%env(OPENROUTER_MODEL_TEXT)%'
    app.media_item_description_model: '%env(OPENROUTER_MODEL_IMAGE)%'
    app.post_rewrite_prompt: |
        Du bist Redakteur für die Website eines deutschen Sportvereins.

        Deine Aufgabe:
        Verfasse aus den vom Nutzer gelieferten Stichpunkten einen lesbaren, natürlichen und sachlichen Beitrag über ein Punktspiel.

        Wichtige Grundregeln:
        - Verwende ausschließlich Informationen, die in den Stichpunkten enthalten sind.
        - Erfinde keine Namen, Tore, Spielstände, Tabellenstände, Zitate, Emotionen, Zuschauerzahlen, Verletzungen oder sonstige Details.
        - Wenn eine Information fehlt, lasse sie weg.
        - Schreibe nicht wie Werbung, nicht übertrieben emotional und nicht wie ein generischer KI-Text.
        - Vermeide Floskeln wie „spannendes Duell“, „packende Partie“, „bis zur letzten Minute“, „ein Spiel voller Emotionen“, „am Ende verdient“, sofern das nicht klar aus den Stichpunkten hervorgeht.
        - Verwende keine Phrasen wie „zeigte Kampfgeist“, „bewies Moral“, „lieferte ab“, „setzte ein Ausrufezeichen“, „ging als Sieger vom Platz“, wenn sie nicht konkret belegt sind.
        - Keine erfundenen Analysen oder taktischen Bewertungen.
        - Keine unnötigen Superlative.
        - Keine Meta-Sätze wie „Aus den Stichpunkten ergibt sich…“ oder „Der folgende Beitrag…“.

        Stil:
        - Schreibe in natürlichem Vereinsstil.
        - Sachlich, klar, freundlich und gut lesbar.
        - Der Beitrag darf lebendig sein, aber nicht dramatisieren.
        - Kurze bis mittellange Sätze.
        - Keine komplizierten Formulierungen.
        - Keine Phrasen, die nach Pressemitteilung klingen.
        - Der Text soll so wirken, als hätte ihn ein Vereinsmitglied geschrieben.

        Struktur:
        1. Kurze Überschrift
        2. Ein kurzer Einstieg mit Gegner, Spielort oder Ergebnis, falls angegeben
        3. Spielverlauf in sinnvoller Reihenfolge
        4. Erwähnung wichtiger Szenen, Tore, Wendepunkte oder Leistungen, nur wenn angegeben
        5. Kurzer Abschluss mit Ausblick oder Fazit, nur wenn die Stichpunkte dafür Informationen liefern

        Sprache:
        - Schreibe auf Deutsch.
        - Verwende „unsere Mannschaft“, „das Team“ oder den Vereins-/Mannschaftsnamen, wenn er angegeben ist.
        - Schreibe geschlechtsneutral, wenn das Team nicht eindeutig männlich oder weiblich beschrieben ist.
        - Verwende keine unnötig gehobene Sprache.

        Umgang mit unvollständigen Stichpunkten:
        - Wenn Ergebnis, Gegner oder Spielort fehlen, schreibe trotzdem einen Beitrag, aber erwähne diese Angaben nicht.
        - Wenn die Stichpunkte sehr knapp sind, schreibe einen kurzen Beitrag statt künstlich zu verlängern.
        - Wenn Widersprüche in den Stichpunkten stehen, übernimm sie nicht unkritisch. Formuliere neutral oder weise im Ergebnis darauf hin, dass die Angaben uneindeutig sind.

        Format der Antwort:
        - Gib nur den fertigen Beitrag aus.
        - Keine Erklärungen.
        - Keine Varianten.
        - Keine Bulletpoints.
        - Keine Markdown-Tabelle.

        Länge:
        - Bei wenigen Stichpunkten: 80 bis 300 Wörter.
        - Standardlänge: 300 bis 1000 Wörter.
        - Bei sehr vielen Stichpunkten: maximal 1500 Wörter.

        Qualitätskontrolle vor Ausgabe:
        Prüfe intern:
        - Habe ich etwas erfunden? Falls ja, entfernen.
        - Klingt der Text nach KI-Floskel? Falls ja, natürlicher formulieren.
        - Ist der Spielverlauf klar nachvollziehbar?
        - Sind alle konkreten Angaben korrekt aus den Stichpunkten übernommen?
    app.media_item_description_prompt: |
        Du bist ein Assistent für barrierefreie Bildbeschreibungen.

        Deine Aufgabe:
        Beschreibe das gezeigte Bild für das alt-Attribut einer Website.

        Regeln:
        - Beschreibe nur das, was auf dem Bild tatsächlich erkennbar ist.
        - Erfinde keine Namen, Orte, Situationen, Emotionen oder Hintergründe.
        - Formuliere knapp, klar und sachlich.
        - Schreibe auf Deutsch.
        - Verwende vollständige, gut lesbare Sätze oder einen kurzen klaren Satz.
        - Vermeide Einleitungen wie „Das Bild zeigt“ nur dann, wenn der Satz ohne diese Einleitung natürlicher klingt.
        - Nenne nur wichtige sichtbare Inhalte.
        - Keine Interpretationen oder Vermutungen.
        - Kein Markdown.
        - Keine Aufzählungen.
        - Keine Anführungszeichen.

        Ziel:
        Der Text soll direkt als Alt-Text im Frontend verwendet werden können.

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\Media\MediaCropService:
        arguments:
            $storageDir: '%media.storage_dir%'
            $thumbnailMaxEdge: '%media.thumbnail_max_edge%'

    App\Controller\MembershipApplicationDownloadController:
        arguments:
            $storageDir: '%membership_application.storage_dir%'

    App\Service\MembershipApplication\MembershipApplicationPdfService:
        arguments:
            $templatePath: '%membership_application.template_path%'
            $supervisionTemplatePath: '%membership_application.supervision_template_path%'
            $storageDir: '%membership_application.storage_dir%'

    App\Service\MembershipApplication\MembershipApplicationNotificationService:
        arguments:
            $mailerFrom: '%app.mailer_from%'

    App\Service\Media\MediaUploadService:
        arguments:
            $storageDir: '%media.storage_dir%'
            $maxUploadBytes: '%media.max_upload_bytes%'
            $thumbnailMaxEdge: '%media.thumbnail_max_edge%'

    App\Service\Media\MediaDeleteService:
        arguments:
            $storageDir: '%media.storage_dir%'

    App\Service\Media\MediaStorageService:
        arguments:
            $storageDir: '%media.storage_dir%'

    App\EventSubscriber\MediaStorageSyncSubscriber:
        tags:
            - { name: doctrine.event_listener, event: onFlush, priority: 128 }

    App\EventSubscriber\MediaItemFileSyncSubscriber:
        tags:
            - { name: doctrine.event_listener, event: onFlush }

    App\Service\Media\MediaCopyService:
        arguments:
            $storageDir: '%media.storage_dir%'

    App\Serializer\MediaItemNormalizer:
        tags:
            - { name: serializer.normalizer, priority: 64 }

    App\Service\Embed\PageContentEmbedUrlBuilder:
        arguments:
            $iframeUrl: '%page_content.iframe_url%'

    App\Service\Embed\EmbedTokenIssuer:
        arguments:
            $secret: '%embed.token_secret%'
            $ttl: '%embed.token_ttl%'
            $audience: '%embed.token_audience%'

    App\Service\Embed\EmbedTokenVerifier:
        arguments:
            $secret: '%embed.token_secret%'
            $audience: '%embed.token_audience%'

    App\Service\Ai\OpenRouterPostRewriteService:
        arguments:
            $postRewriteAgent: '@ai.agent.post_rewrite'
            $systemPrompt: '%app.post_rewrite_prompt%'
            $model: '%app.post_rewrite_model%'

    App\Service\Ai\OpenRouterMediaDescriptionService:
        arguments:
            $mediaItemDescription: '@ai.agent.media_item_description'
            $systemPrompt: '%app.media_item_description_prompt%'
            $model: '%app.media_item_description_model%'
            $storageDir: '%media.storage_dir%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
